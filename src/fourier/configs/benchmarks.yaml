    archive_sha256: 6c48ccf22c90b9af8dcf0e2cd70849aec8dd8e214ac5f1f09552bf8bc9494acc
    collection_policy: original DINO-WM fully random force trajectories
    released_episodes: 2000
    released_episode_length: 100
    split_episodes: {train: 1800, validation: 200}
    approved_unpacked_by_split:
      train: [f79b71809cb04e84d7b4fd8450cf6cc1a4bc276ef5079c582c062d2edeaf19e6]
      validation: [0922aba84715af71dac30fdbbb5acabb152d279c5b8e8e3c68722757087845d2]
    note: Original episode split via torch.randperm seed42, before clipping. Original images/actions/state/proprio preserved. Native MuJoCo2.1 runtime required for evaluation.

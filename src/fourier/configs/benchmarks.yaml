    released_episodes: 18685
    released_frames: 2336736
    paper_episodes: 20000
    paper_epochs: 10
    note: Paper describes 20k episodes; pin the actual released HDF5 (18,685 episodes),
      not an assumed episode count.
  lewm_cube:
    collection_policy: OGBench single-cube collection heuristic
    environment: cube
    source: https://huggingface.co/datasets/quentinll/lewm-cube
    revision: 02a19a67a0dc8c9d6215f89c19e0a597691e152a
    artifact: cube_single_expert.tar.zst
    archive_sha256: 3725d6a01abd492164441ef0a27e588f52b94a118fab56b96987b1a34a6c2600
    approved_unpacked_sha256: []
    released_episodes: 10000
    released_frames: 2010000
    released_episode_length: 201
    paper_episodes: 10000
    paper_episode_length: 200
    paper_epochs: 10
    note: LeWM-collected single-cube expert release. Each episode stores 200
      transitions plus its terminal observation (201 rows; final action is NaN).
      The official OGBench play NPZ is a different dataset.
  lewm_tworooms:
    collection_policy: Noisy heuristic through the door then toward the target
    environment: tworoom
    source: https://huggingface.co/datasets/quentinll/lewm-tworooms
    revision: 6903a2de048b13819d812da0b4dd661290bc01e4
    artifact: tworoom.tar.zst
    archive_sha256: 494b1a02f0765cd9a0d9daf1786c419ced1009977fc45d01e3158932f8d080ca
    approved_unpacked_sha256: []
    released_episodes: 10000
    paper_episodes: 10000
    paper_epochs: 10
paper_priority: [swm, lewm, dinowm]
# Coverage means published control results, not merely a registered environment.
published:
  swm:
    environments: [pusht, cube]
    protocol: swm_table1
    train_models: [fourier]
    history: 3
    epochs: 10
    training_evidence: Appendix I delegates to original publications; Fourier uses the LeWM 10-epoch encoder/dynamics budget.
    evaluation_evidence: Push-T Appendix I; Cube uses pinned released cube.yaml and solver/cem.yaml because Appendix I only details Push-T.
    unresolved:
      dinowm: SWM source defaults to 10 epochs but Appendix I delegates to DINO-WM whose paper and source specify 100. Reuse the published result; baseline retraining needs an explicit resolved protocol.
  lewm:
    environments: [pusht, cube, tworoom, reacher]
    protocol: lewm_paper
    train_models: [fourier]
    history: 3
    epochs: 10
    environment_overrides:
      tworoom:
        history: 1
    training_evidence: Appendices D/E; 10 epochs, history one for TwoRoom and three for Push-T/Cube; DINO-WM excludes proprioception unless specified.
    evaluation_evidence: Appendices D/F.1; offset 25, budget 50; CEM 30 iterations for Push-T and 10 otherwise.
    unresolved: {}
  dinowm:
    environments: [pusht, reacher, dinowm_pointmaze, dinowm_wall, rope, granular, wall_random, pushobj, granular_random]
    protocol: dinowm_paper
    train_models: [fourier, lewm]
    epochs: 100
    history: 3
    frameskip: 5
    environment_overrides:
      dinowm_wall: {history: 1}
      wall_random: {history: 1}
      rope: {history: 1, frameskip: 1}
      granular: {history: 1, frameskip: 1}
      granular_random: {history: 1, frameskip: 1}
    training_evidence: Appendix A.9 and pinned conf/train.yaml; episode split and environment-specific frameskip/history must use the original dataset loader.
    evaluation_evidence: Original plan configs; random-state goals and MPC, not the SWM dataset-offset task sampler.
    unresolved:
      optimizer: Paper predictor LR 5e-5 conflicts with released conf/train.yaml 5e-4; paper text also conflicts on 196 versus 224 image size. Do not silently choose or label an unverified adaptation exact.

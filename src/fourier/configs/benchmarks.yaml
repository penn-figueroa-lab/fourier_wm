protocol:
  dinowm_paper:
    name: d4rl_image_history
    allowed_environments: [dinowm_pointmaze]
    num_eval: 50
    goal_source: random_state
    success_check: replan_boundary
    task_seed: 99
    goal_offset: 25
    budget: 250
    horizon_steps: 25
    replan_steps: 25
    feedback: false
    feedback_q: 1.0
    feedback_r: 1.0
    budget_status: image-only project adaptation with three-frame context and a 250-step cap; DINO-WM's proprioceptive 98% result is not a matched baseline
  swm_table1:
    name: swm_table1

    collection_policy: DINO-WM expert demonstrations (author release)
    environment: pusht
    source: https://huggingface.co/datasets/quentinll/lewm-pusht
    revision: 655cd446b9929369d7d406001da85c15d1457850
    artifact: pusht_expert_train.h5.zst
    archive_sha256: 7cfbd6d90fa2f27876379a5ff169715a36ed82edbda64f9e5b5bfa34d212f318

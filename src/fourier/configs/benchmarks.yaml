# Shared protocols, planners and publication priority. Environment/data details are in env/*.yaml.
protocol:
  dinowm_paper:
    name: d4rl_image_history
    allowed_environments: [dinowm_pointmaze]
    num_eval: 50
    goal_source: random_state
    success_check: replan_boundary
    task_seed: 99
    goal_offset: 25
    budget: 250
    horizon_steps: 25
    replan_steps: 25
    feedback: false
    feedback_q: 1.0
    feedback_r: 1.0
    budget_status: image-only project adaptation with three-frame context and a 250-step cap; DINO-WM's
      proprioceptive 98% result is not a matched baseline
  swm_table1:
    name: swm_table1
    allowed_environments: [pusht, cube]
    num_eval: 50
    goal_offset: 25
    budget: 50
    horizon_steps: 25
    replan_steps: 25
    feedback: false
    feedback_q: 1.0
    feedback_r: 1.0
  closed_loop:
    name: closed_loop
    horizon_schedule: fixed
    allowed_environments: null
    num_eval: 100
    goal_offset: 25
    budget: 50
    horizon_steps: 25
    replan_steps: 5
    feedback: false
    feedback_q: 1.0
    feedback_r: 1.0
  dataset_goal:
    name: dataset_goal
    allowed_environments: null
    num_eval: 50
    goal_offset: 25
    budget: 50
    horizon_steps: 25
    replan_steps: 25
    feedback: false
    feedback_q: 1.0
    feedback_r: 1.0
  swm_paper:
    name: swm_paper
    allowed_environments: [pusht]
    num_eval: 50
    goal_offset: 25
    budget: 50
    horizon_steps: 25
    replan_steps: 25
    feedback: false
    feedback_q: 1.0
    feedback_r: 1.0
  lewm_paper:
    name: lewm_paper
    allowed_environments: [pusht, cube, tworoom]
    num_eval: 50
    goal_offset: 25
    budget: 50
    horizon_steps: 25
    replan_steps: 25
    feedback: false
    feedback_q: 1.0
    feedback_r: 1.0
planner:
  cem:
    name: cem
    num_samples: 300
    n_steps: 30
    topk: 30
    var_scale: 1.0
  sqp:
    name: sqp
    iterations: 10
    starts: 8
    initialization: gaussian
    initialization_amplitude: 0.8
    smoothness: 0.1
    magnitude: 0.0
    damping: 0.01
    bound: 3.0
    max_step: 1.0
paper_priority: [swm, lewm, dinowm]
published:
  swm:
    environments: [pusht, cube]
    protocol: swm_table1
    train_models: [fourier]
    history: 3
    epochs: 10
    training_evidence: Appendix I delegates to original publications; Fourier uses the LeWM 10-epoch encoder/dynamics
      budget.
    evaluation_evidence: Push-T Appendix I; Cube uses pinned released cube.yaml and solver/cem.yaml because
      Appendix I only details Push-T.
    unresolved:
      dinowm: SWM source defaults to 10 epochs but Appendix I delegates to DINO-WM whose paper and source
        specify 100. Reuse the published result; baseline retraining needs an explicit resolved protocol.
  lewm:
    environments: [pusht, cube, tworoom, reacher]
    protocol: lewm_paper
    train_models: [fourier]
    history: 3
    epochs: 10
    environment_overrides:
      tworoom:
        history: 1
    training_evidence: Appendices D/E; 10 epochs, history one for TwoRoom and three for Push-T/Cube; DINO-WM
      excludes proprioception unless specified.
    evaluation_evidence: Appendices D/F.1; offset 25, budget 50; CEM 30 iterations for Push-T and 10 otherwise.
    unresolved: {}
  dinowm:
    environments: [pusht, reacher, dinowm_pointmaze, dinowm_wall, rope, granular, wall_random, pushobj,
      granular_random]
    protocol: dinowm_paper
    train_models: [fourier, lewm]
    epochs: 100
    history: 3
    frameskip: 5
    environment_overrides:
      dinowm_wall:
        history: 1
      wall_random:
        history: 1
      rope:
        history: 1
        frameskip: 1
      granular:
        history: 1
        frameskip: 1
      granular_random:
        history: 1
        frameskip: 1
    training_evidence: Appendix A.9 and pinned conf/train.yaml; episode split and environment-specific
      frameskip/history must use the original dataset loader.
    evaluation_evidence: Original plan configs; random-state goals and MPC, not the SWM dataset-offset
      task sampler.
    unresolved:
      optimizer: Paper predictor LR 5e-5 conflicts with released conf/train.yaml 5e-4; paper text also
        conflicts on 196 versus 224 image size. Do not silently choose or label an unverified adaptation
        exact.
papers:
  lewm: https://arxiv.org/html/2603.19312v3
  swm: https://arxiv.org/html/2605.21800v1
  dinowm: https://arxiv.org/html/2411.04983v2
  lewm_code_revision: 8edfeb336732b5f3ce7b8b210d0ba370a09e2cac
  dinowm_code_revision: 0a9492fa12044b852ae9e001cc74604b79c8bb0c

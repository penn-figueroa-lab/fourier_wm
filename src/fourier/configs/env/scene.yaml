  note: >-
    Released SWM visual Scene data, not OGBench state-only play NPZ. Project benchmark,
    not SWM Table 1. Metadata-only views hold out complete episodes for validation/test;
    images/actions are shared read-only with the original release. Success requires all
    cube/button/drawer/window targets, using native tolerances. Privileged fields are reset-only.

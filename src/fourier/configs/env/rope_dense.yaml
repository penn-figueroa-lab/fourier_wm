# Matched primitive-step project benchmark, derived from the pinned native release.
environment:
  name: rope_dense
  id: fourier/RopeDense-v1
  family: deformable_dense
  kwargs:
    object_name: rope
  image_size: 224
  observation_keys: [pixels]
  rendering:
    engine: pyflex
    camera_view: 1
    image_order: RGB
  action:
    kinds: [delta, delta, delta]
    scale: [1, 1, 1]
    dt: 0.016666666666666666
    units: [scene_unit/s, scene_unit/s, scene_unit/s]
    low: [-0.02, -0.02, -0.02]
    high: [0.02, 0.02, 0.02]
  collection:
    policy: dense_native_replay
    source_parents: 1000
    source_split: {train: 900, validation: 100}
    pushes_per_parent: 20
    window_frames: 101
    seed: 42
  benchmark: project_dense_deformable
  dataset: custom

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fourier-wm"
version = "0.1.0"
requires-python = ">=3.10"
description = "Fourier dynamics and JAX SQP adapters for the vendored SWM"
dependencies = ["torch", "numpy<2", "hydra-core", "stable-worldmodel", "stable-pretraining", "lightning", "scikit-learn"]

[project.optional-dependencies]
planning = ["jax[cpu]>=0.4.35"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

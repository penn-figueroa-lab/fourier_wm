defaults:
  - plan@solver: sqp
  - _self_
hydra:
  job:
    chdir: false
  run:
    dir: artifacts/hydra/eval/${now:%Y%m%d_%H%M%S}
policy: fourier_ogcube/weights.pt
seed: 42
cache_dir: null
compile: false
bf16: false
world:
  env_name: swm/OGBCube-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: 100
  env_type: single
  ob_type: states
  multiview: false
  width: 224
  height: 224
  visualize_info: false
  terminate_at_goal: true
dataset:
  keys_to_cache: [action]
  stats: ${eval.dataset_name}
plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5
  history_len: 1
  warm_start: true
objective:
  _target_: stable_worldmodel.planning.GoalMSE
  reduction: mean
eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: /home/zmhuang/fourier_wm/artifacts/data/ogcube_valid_eval.h5
  callables:
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
    - method: set_target_pos
      args:
        cube_id:
          value: 0
          in_dataset: false
        target_pos:
          value: goal_privileged_block_0_pos
        target_quat:
          value: goal_privileged_block_0_quat
output:
  filename: ogb_cube_results.txt

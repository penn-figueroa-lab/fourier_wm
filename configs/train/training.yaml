# @package _global_
# Preserve upstream LeWM training settings; select the task through data overrides.
defaults:
- /scripts/train/config/lewm@_global_
- /model@fourier_model: fourier
- _self_
- override hydra/job_logging: disabled
- override hydra/hydra_logging: disabled
hydra:
  output_subdir: null
  job:
    chdir: false
  run:
    dir: .
  searchpath:
  - file://./configs
  - file://./stable-worldmodel
model: ${fourier_model}
# Checkpoint management is project-owned; model/data/loss settings stay upstream.
resume_from: null
checkpoint_every_steps: 1000
checkpoint_dir: checkpoint
validation_dataset: null
subdir: .
